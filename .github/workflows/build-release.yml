name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  APP_NAME: SyStats
  BUILD_DIR: build/Build/Products/Release

jobs:
  build:
    name: Build macOS app
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain info
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version

      - name: Validate Info.plist
        run: plutil -lint Config/Info.plist

      - name: Generate Xcode project from project.yml
        run: |
          set +e
          output=$(xcodegen generate --spec project.yml --project . 2>&1)
          code=$?
          set -e
          echo "$output"
          {
            echo "### XcodeGen"
            echo '```'
            echo "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      # Pola build ini yang terbukti jalan di BatteryLenovoAssistent.
      - name: Build (Release, universal x86_64 + arm64)
        run: |
          set -o pipefail
          xcodebuild \
            -project SyStats.xcodeproj \
            -scheme SyStats \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            -quiet \
            MACOSX_DEPLOYMENT_TARGET=13.0 \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER= \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS='x86_64 arm64' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee xcodebuild.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "## xcodebuild failed (exit $status)"
              echo '```'
              grep -E "error:|fatal error:|\*\* BUILD FAILED" xcodebuild.log | sort -u | head -80
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi

      - name: Kirim log error ke Issue (hanya saat gagal)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Build gagal pada run #${{ github.run_number }}."
            echo ""
            echo "Log: ${RUN_URL}"
            echo ""
            echo '```'
            grep -E "error:|fatal error:|\*\* BUILD FAILED" xcodebuild.log | sort -u | head -80 || true
            echo '```'
          } > failure-body.md
          gh issue create \
            --title "CI build failure run #${{ github.run_number }}" \
            --body-file failure-body.md || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-${{ github.run_number }}
          path: xcodebuild.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Verify app bundle
        run: |
          APP="${BUILD_DIR}/${APP_NAME}.app"
          test -d "$APP"
          test -x "$APP/Contents/MacOS/${APP_NAME}"
          test -f "$APP/Contents/Resources/Assets.car"
          echo "Architectures: $(lipo -archs "$APP/Contents/MacOS/${APP_NAME}")"
          lipo -archs "$APP/Contents/MacOS/${APP_NAME}" | grep -q x86_64

      - name: Ad-hoc codesign
        run: |
          APP="${BUILD_DIR}/${APP_NAME}.app"
          xattr -cr "$APP"
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Package (zip + dmg)
        run: |
          set -euo pipefail
          NAME="${APP_NAME}-${{ github.ref_name }}"
          mkdir -p release dmg-staging
          ditto -c -k --sequesterRsrc --keepParent "${BUILD_DIR}/${APP_NAME}.app" "release/${NAME}.zip"
          cp -R "${BUILD_DIR}/${APP_NAME}.app" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "SyStats" -srcfolder dmg-staging -ov -format UDZO "release/${NAME}.dmg"
          (cd release && shasum -a 256 *.zip *.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyStats-${{ github.sha }}
          path: release/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## SyStats (${{ github.ref_name }})

            Native macOS app untuk Hackintosh: inspector EFI/ACPI read-only, telemetri menu bar dinamis, dan adapter charge-threshold modular. Universal (Intel x86_64 + Apple Silicon), macOS 13 Ventura ke atas.

            Unduh `.dmg`, seret `SyStats.app` ke Applications, klik kanan → **Open**. Atau pakai `.zip`. Cek hash di `SHA256SUMS.txt`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Setiap push tag otomatis memperbarui appcast.xml untuk Sparkle.
      - name: Update appcast.xml (Sparkle signature)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${SPARKLE_PRIVATE_KEY:-}" ]; then
            echo "::warning::SPARKLE_PRIVATE_KEY secret belum diset — appcast.xml tidak diperbarui."
            exit 0
          fi

          echo "==> Siapkan sign_update Sparkle"
          CACHE="$RUNNER_TEMP/sparkle-2.10.1"
          mkdir -p "$CACHE"
          if [ ! -x "$CACHE/sign_update" ]; then
            curl -fsSL --retry 3 -o "$CACHE/Sparkle.tar.xz" \
              https://github.com/sparkle-project/Sparkle/releases/download/2.10.1/Sparkle-2.10.1.tar.xz
            tar -xJf "$CACHE/Sparkle.tar.xz" -C "$CACHE" bin/sign_update
            mv "$CACHE/bin/sign_update" "$CACHE/sign_update"
            chmod +x "$CACHE/sign_update"
          fi

          ZIP="release/SyStats-${TAG}.zip"
          test -f "$ZIP"
          LENGTH="$(stat -f%z "$ZIP")"
          SIGNATURE="$("$CACHE/sign_update" --ed-key-file - -p "$ZIP" <<< "$SPARKLE_PRIVATE_KEY")"

          VERSION="${TAG#v}"
          BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${BUILD_DIR}/${APP_NAME}.app/Contents/Info.plist")"
          PUBDATE="$(date -u '+%a, %d %b %Y %H:%M:%S +0000')"
          URL="https://github.com/${REPO}/releases/download/${TAG}/SyStats-${TAG}.zip"

          echo "==> Tulis item appcast untuk ${VERSION} (build ${BUILD_NUMBER}, ${LENGTH} bytes)"
          python3 - "$VERSION" "$BUILD_NUMBER" "$PUBDATE" "$URL" "$SIGNATURE" "$LENGTH" <<'PY'
          import sys, re, xml.etree.ElementTree as ET
          from xml.dom import minidom
          version, build, pubdate, url, sig, length = sys.argv[1:]
          ns = "http://www.andymatuschak.org/xml-namespaces/sparkle"
          ET.register_namespace("sparkle", ns)
          tree = ET.parse("appcast.xml")
          root = tree.getroot()
          channel = root.find("channel")
          for existing in list(channel.findall("item")):
              if existing.get("{"+ns+"}shortVersionString") == version:
                  channel.remove(existing)
          item = ET.Element("item")
          ET.SubElement(item, "title").text = f"Version {version}"
          ET.SubElement(item, "pubDate").text = pubdate
          enc = ET.SubElement(item, "enclosure", {
              "url": url,
              "{"+ns+"}version": build,
              "{"+ns+"}shortVersionString": version,
              "{"+ns+"}edSignature": sig,
              "type": "application/octet-stream",
              "length": length,
          })
          # Sisipkan setelah metadata channel (title/link/description/language),
          # bukan di index 0, agar struktur RSS tetap valid untuk Sparkle.
          metadata_tags = {"title", "link", "description", "language"}
          insert_at = 0
          for idx, child in enumerate(list(channel)):
              if child.tag in metadata_tags:
                  insert_at = idx + 1
          channel.insert(insert_at, item)
          xml = minidom.parseString(ET.tostring(root, encoding="utf-8")).toprettyxml(indent="  ")
          open("appcast.xml", "w").write(xml)
          PY

          xmllint --noout appcast.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          if git diff --cached --quiet; then
            echo "appcast.xml sudah up to date."
          else
            git commit -m "chore: update appcast.xml for ${TAG} [skip ci]"
            git push origin HEAD:main
          fi
