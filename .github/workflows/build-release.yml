name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build macOS app
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project from project.yml
        run: |
          set +e
          output=$(xcodegen generate --spec project.yml --project SyStats.xcodeproj 2>&1)
          code=$?
          set -e
          {
            echo "### XcodeGen"
            echo '```'
            echo "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Build (Release, unsigned)
        run: |
          xcodebuild \
            -project SyStats.xcodeproj \
            -scheme SyStats \
            -configuration Release \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Verify app bundle
        run: test -d "build/Build/Products/Release/SyStats.app"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyStats-${{ github.sha }}
          path: build/Build/Products/Release/SyStats.app
          if-no-files-found: error

      - name: Package release archive
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent \
            "build/Build/Products/Release/SyStats.app" \
            "release/SyStats-${GITHUB_REF_NAME}.zip"
          shasum -a 256 release/*.zip > release/SHA256SUMS.txt
          cat release/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## SyStats (${{ github.ref_name }})

            Native macOS app for Hackintosh: EFI/ACPI read-only inspector, dynamic menu bar telemetry, and modular charge-threshold adapters.

            Unsigned build. After downloading, run:
            `xattr -cr "/Applications/SyStats.app"`

            See README.md for EFI paths, SMC key assumptions, and adapter diagnostics.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
