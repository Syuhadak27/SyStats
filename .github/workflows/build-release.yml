name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build macOS app
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version

      - name: Validate Info.plist
        run: plutil -lint Config/Info.plist

      - name: Generate Xcode project from project.yml
        run: |
          set +e
          output=$(xcodegen generate --spec project.yml --project . 2>&1)
          code=$?
          set -e
          echo "$output"
          {
            echo "### XcodeGen"
            echo '```'
            echo "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Build (Release, universal x86_64 + arm64)
        run: |
          set -o pipefail
          xcodebuild \
            -project SyStats.xcodeproj \
            -scheme SyStats \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            ARCHS="x86_64 arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log

      - name: Show compiler errors (only on failure)
        if: failure()
        run: |
          {
            echo "### Compiler errors"
            echo '```'
            grep -E "error:|fatal error:|\*\* BUILD FAILED" xcodebuild.log | sort -u | head -60 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-${{ github.run_number }}
          path: xcodebuild.log
          if-no-files-found: ignore

      - name: Verify app bundle
        run: |
          APP="build/Build/Products/Release/SyStats.app"
          test -d "$APP"
          test -x "$APP/Contents/MacOS/SyStats"
          test -f "$APP/Contents/Info.plist"
          test -f "$APP/Contents/Resources/Assets.car"
          echo "Architectures: $(lipo -archs "$APP/Contents/MacOS/SyStats")"
          lipo -archs "$APP/Contents/MacOS/SyStats" | grep -q x86_64
          plutil -p "$APP/Contents/Info.plist" | head -30

      # Ad-hoc signature: tanpa Apple Developer ID, tapi membuat bundle valid
      # sehingga Gatekeeper menawarkan "Open" lewat klik kanan (bukan "rusak").
      - name: Ad-hoc codesign
        run: |
          APP="build/Build/Products/Release/SyStats.app"
          xattr -cr "$APP"
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | head -10

      # upload-artifact membuang permission file (bit executable). Karena itu
      # .app TIDAK boleh diunggah mentah; bungkus dulu dengan ditto / hdiutil.
      - name: Package (zip + dmg)
        run: |
          APP="build/Build/Products/Release/SyStats.app"
          NAME="SyStats-${GITHUB_REF_NAME//\//-}"
          mkdir -p release dmgroot
          ditto -c -k --sequesterRsrc --keepParent "$APP" "release/${NAME}.zip"

          ditto "$APP" "dmgroot/SyStats.app"
          ln -s /Applications dmgroot/Applications
          cat > "dmgroot/CARA BUKA.txt" <<'EOF'
          SyStats - cara membuka (tanpa Terminal)

          1. Seret SyStats.app ke folder Applications.
          2. Buka Applications, KLIK KANAN SyStats.app, pilih "Open", lalu klik "Open" lagi.
          3. Cukup sekali. Berikutnya bisa dibuka seperti biasa.

          macOS 15 (Sequoia) ke atas:
          Setelah percobaan pertama ditolak, buka
          System Settings > Privacy & Security, gulir ke bawah,
          klik "Open Anyway" di samping SyStats, lalu "Open".
          EOF
          hdiutil create -volname "SyStats" -srcfolder dmgroot -ov -format UDZO "release/${NAME}.dmg"

          (cd release && shasum -a 256 *.zip *.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyStats-${{ github.sha }}
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## SyStats (${{ github.ref_name }})

            Native macOS app untuk Hackintosh: inspector EFI/ACPI read-only, telemetri menu bar dinamis, dan adapter charge-threshold modular. Universal (Intel x86_64 + Apple Silicon).

            **Cara membuka (tanpa Terminal):** seret `SyStats.app` ke Applications → klik kanan → **Open** → **Open**.
            Di macOS 15+: System Settings → Privacy & Security → **Open Anyway**.

            Build ini ad-hoc signed (tanpa Apple Developer ID), jadi peringatan Gatekeeper pertama kali normal.

            Lihat README.md untuk path EFI, asumsi SMC key, dan diagnostik adapter.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
