name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  APP_NAME: SyStats
  BUILD_DIR: build/Build/Products/Release

jobs:
  build:
    name: Build macOS app
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain info
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version

      - name: Validate Info.plist
        run: plutil -lint Config/Info.plist

      - name: Generate Xcode project from project.yml
        run: |
          set +e
          output=$(xcodegen generate --spec project.yml --project . 2>&1)
          code=$?
          set -e
          echo "$output"
          {
            echo "### XcodeGen"
            echo '```'
            echo "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      # Pola build ini yang terbukti jalan di BatteryLenovoAssistent.
      - name: Build (Release, universal x86_64 + arm64)
        run: |
          set -o pipefail
          xcodebuild \
            -project SyStats.xcodeproj \
            -scheme SyStats \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            -quiet \
            MACOSX_DEPLOYMENT_TARGET=13.0 \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER= \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS='x86_64 arm64' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee xcodebuild.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "## xcodebuild failed (exit $status)"
              echo '```'
              grep -E "error:|fatal error:|\*\* BUILD FAILED" xcodebuild.log | sort -u | head -80
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi

      - name: Kirim log error ke Issue (hanya saat gagal)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Build gagal pada run #${{ github.run_number }}."
            echo ""
            echo "Log: ${RUN_URL}"
            echo ""
            echo '```'
            grep -E "error:|fatal error:|\*\* BUILD FAILED" xcodebuild.log | sort -u | head -80 || true
            echo '```'
          } > failure-body.md
          gh issue create \
            --title "CI build failure run #${{ github.run_number }}" \
            --body-file failure-body.md || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-${{ github.run_number }}
          path: xcodebuild.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Verify app bundle
        run: |
          APP="${BUILD_DIR}/${APP_NAME}.app"
          test -d "$APP"
          test -x "$APP/Contents/MacOS/${APP_NAME}"
          test -f "$APP/Contents/Resources/Assets.car"
          echo "Architectures: $(lipo -archs "$APP/Contents/MacOS/${APP_NAME}")"
          lipo -archs "$APP/Contents/MacOS/${APP_NAME}" | grep -q x86_64

      - name: Ad-hoc codesign
        run: |
          APP="${BUILD_DIR}/${APP_NAME}.app"
          xattr -cr "$APP"
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Package (zip + dmg)
        run: |
          set -euo pipefail
          NAME="${APP_NAME}-${{ github.ref_name }}"
          mkdir -p release dmg-staging
          ditto -c -k --sequesterRsrc --keepParent "${BUILD_DIR}/${APP_NAME}.app" "release/${NAME}.zip"
          cp -R "${BUILD_DIR}/${APP_NAME}.app" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "SyStats" -srcfolder dmg-staging -ov -format UDZO "release/${NAME}.dmg"
          (cd release && shasum -a 256 *.zip *.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyStats-${{ github.sha }}
          path: release/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## SyStats (${{ github.ref_name }})

            Native macOS app untuk Hackintosh: inspector EFI/ACPI read-only, telemetri menu bar dinamis, dan adapter charge-threshold modular. Universal (Intel x86_64 + Apple Silicon), macOS 13 Ventura ke atas.

            Unduh `.dmg`, seret `SyStats.app` ke Applications, klik kanan → **Open**. Atau pakai `.zip`. Cek hash di `SHA256SUMS.txt`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
