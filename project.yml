name: SyStats

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.1

options:
  bundleIdPrefix: com.systats
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top

settingGroups:
  common:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    # Universal: Hackintosh = Intel (x86_64), Mac modern = arm64.
    # Tanpa ini runner macos-latest (arm64) hanya menghasilkan arm64
    # dan app langsung "bad CPU type" di Hackintosh Intel.
    ARCHS: "x86_64 arm64"
    ONLY_ACTIVE_ARCH: NO
    # Signing ad-hoc dilakukan di workflow (codesign --sign -), bukan oleh Xcode.
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    CLANG_ENABLE_MODULES: YES
    ALWAYS_SEARCH_USER_PATHS: NO

targets:
  SyStats:
    type: application
    platform: macOS
    # Assets.xcassets HARUS ada di `sources` (XcodeGen tidak punya key `resources`;
    # key itu diabaikan diam-diam sehingga ikon & MenuBarIcon tidak ikut ter-bundle).
    sources:
      - path: Sources
      - path: Assets.xcassets
    # Pengganti `links:` (bukan key XcodeGen yang valid).
    dependencies:
      - sdk: IOKit.framework
      - package: Sparkle
    settings:
      groups: [common]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.systats.app
        PRODUCT_NAME: SyStats
        MARKETING_VERSION: 1.3.0
        CURRENT_PROJECT_VERSION: 5
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Info.plist ditulis manual (Config/Info.plist). Blok `info:` XcodeGen
        # mewajibkan `path:` dan itulah yang membuat `xcodegen generate` gagal.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Info.plist
    schemes:
      SyStats:
        build:
          targets:
            SyStats: [run, archive]
